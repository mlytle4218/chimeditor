# ChimEditor Keyboard Controls Configuration
# Maps keyboard inputs to playback and editor controls.

# Key names:
#   - Single characters: "space", "z", "f", "r", "p", "q", etc.
#   - Special keys: "left", "right", "up", "down", "home", "end", "esc" (or "escape")

keybindings:
  # Play / Pause toggle
  play_pause:
    - "space"

  # Reset playback speed back to normal (1.0x)
  normal_speed:
    - "z"
    - "Z"

  # Increase playback speed by speed_step (0.5x)
  speed_up:
    - "up"

  # Decrease playback speed by speed_step (0.5x)
  speed_down:
    - "down"

  # Fast forward playback (2x)
  fast_forward:
    - "f"
    - "F"

  # Reverse playback (-1x)
  reverse:
    - "r"
    - "R"

  # Seek backward by seek_step_seconds
  seek_backward:
    - "left"

  # Seek forward by seek_step_seconds
  seek_forward:
    - "right"

  # Jump to beginning (0.0s)
  seek_beginning:
    - "home"

  # Jump to the end of audio and pause
  seek_end:
    - "end"

  # Display current playhead position and duration
  display_position:
    - "p"
    - "P"

  # Display current playhead position in words (hours, minutes, seconds)
  display_timestamp_words:
    - "w"
    - "W"

  # Mark beginning of a skip section
  mark_skip_start:
    - "b"

  # Skip from the beginning of the file to the current point
  skip_from_beginning:
    - "B"

  # Mark end of a skip section
  mark_skip_end:
    - "e"

  # Skip from the current point to the end of the file
  skip_to_end:
    - "E"

  # Toggle editing mode (audible tones at skip boundaries instead of skipping)
  toggle_editing_mode:
    - "A"

  # Delete skip under playhead (when in editing mode)
  delete_skip:
    - "d"
    - "D"

  # Jump to 2 seconds before next skip (cycle through skips)
  cycle_skips:
    - "C"

  # Nudge beginning of current edit 0.25s earlier (when in editing mode)
  nudge_start_earlier:
    - "n"

  # Nudge beginning of current edit 0.25s later (when in editing mode)
  nudge_start_later:
    - "m"

  # Nudge end of current edit 0.25s earlier (when in editing mode)
  nudge_end_earlier:
    - "N"

  # Nudge end of current edit 0.25s later (when in editing mode)
  nudge_end_later:
    - "M"

  # Export non-skipped audio/video with FFmpeg
  export:
    - "o"
    - "O"

  # Quit the application
  quit:
    - "q"
    - "Q"
    - "esc"

# Playback and navigation settings
settings:
  # Output file format/extension for exported media (always outputs to mp4 by default)
  output_format: "mp4"

  # Speed increment when speed_up / speed_down is pressed
  speed_step: 0.5

  # Seconds to seek on seek_backward / seek_forward
  seek_step_seconds: 5.0

  # Playback rate multipliers
  fast_forward_speed: 2.0
  reverse_speed: -1.0
